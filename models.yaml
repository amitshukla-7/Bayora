version: "1.0"
models:
  - id: "ollama-llama3.2"
    name: "Llama 3.2 3B (Local Ollama)"
    provider: "ollama"
    model_identifier: "llama3.2:3b"
    base_url: "http://localhost:11434"
    parameters:
      temperature: 0.0
      seed: 42
    description: "Local Ollama instance running Llama 3.2 3B. Credential-free deterministic local execution."

  - id: "openai-gpt4o"
    name: "OpenAI GPT-4o"
    provider: "openai"
    model_identifier: "gpt-4o"
    base_url: "https://api.openai.com/v1"
    api_key_env: "OPENAI_API_KEY"
    parameters:
      temperature: 0.0
    description: "OpenAI GPT-4o model via standard OpenAI API endpoint."

  - id: "vllm-local"
    name: "vLLM Local Server"
    provider: "openai-compatible"
    model_identifier: "meta-llama/Llama-3.2-3B-Instruct"
    base_url: "http://localhost:8000/v1"
    api_key_env: "VLLM_API_KEY"
    parameters:
      temperature: 0.0
    description: "High-throughput local vLLM OpenAI-compatible endpoint."

  - id: "anthropic-claude"
    name: "Anthropic Claude 3.5 Sonnet"
    provider: "anthropic"
    model_identifier: "claude-3-5-sonnet-20241022"
    base_url: "https://api.anthropic.com/v1"
    api_key_env: "ANTHROPIC_API_KEY"
    parameters:
      temperature: 0.0
    description: "Anthropic Claude 3.5 Sonnet via Anthropic Messages API."
