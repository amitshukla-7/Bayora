services:
  # Isolated Red-Team Container
  red:
    image: alpine:3.20
    container_name: sentinelflow_red
    command: ["sh", "-c", "echo 'RED_SECRET=isolated_red_vault_key_9912' > /data/secret.txt && sleep infinity"]
    networks:
      - red_net
    volumes:
      - red_data:/data
    restart: unless-stopped

  # Isolated Blue-Team Target Container
  blue:
    image: alpine:3.20
    container_name: sentinelflow_blue
    command: ["sh", "-c", "apk add --no-cache curl bind-tools procps && sleep infinity"]
    networks:
      - blue_net
    volumes:
      - blue_data:/data
    restart: unless-stopped

  # MinIO S3-Compatible Object Store for Credential Isolation Testing
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: sentinelflow_minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: "bayora_admin"
      MINIO_ROOT_PASSWORD: "bayora_strong_vault_password_2026"
    networks:
      - lab_net
    volumes:
      - minio_data:/data
    restart: unless-stopped

  # SentinelFlow Gateway Proxy
  model-gateway:
    image: node:24-alpine
    container_name: sentinelflow_gateway
    working_dir: /app
    volumes:
      - .:/app
    command: ["npm", "run", "server"]
    environment:
      PORT: 3001
      NODE_ENV: production
    ports:
      - "3001:3001"
    networks:
      - lab_net
      - blue_net
    restart: unless-stopped

  # Local Ollama Container (Credential-Free Local Evaluation)
  ollama:
    image: ollama/ollama:latest
    container_name: sentinelflow_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - lab_net
    restart: unless-stopped

networks:
  red_net:
    driver: bridge
    internal: true # Air-gapped network
  blue_net:
    driver: bridge
  lab_net:
    driver: bridge

volumes:
  red_data:
  blue_data:
  minio_data:
  ollama_data:
